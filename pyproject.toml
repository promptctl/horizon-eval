[project]
name = "macklebox"
# The observable surface this project reimplements is mackup 0.11.1's (see
# appspec/00-overview.md "Provenance"): `--version` reports this package's own
# version, so the version declared here IS the compatibility claim.
version = "0.11.1"
description = "Keep application settings in sync across machines via an already-synced folder"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "macklebox contributors" }]
dependencies = []

[project.scripts]
mackup = "macklebox.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macklebox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
