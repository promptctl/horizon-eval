[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macklebox"
# The observable surface is the spec's, and appspec/00-overview.md pins the
# reference build's version string ("Mackup 0.11.1", and the `list` trailer
# "... supported in Mackup v0.11.1"). The package version IS that string's
# source, so it carries the spec's value rather than a fresh 0.1.0.
version = "0.11.1"
description = "Keep application settings in sync across machines (clean-room build from appspec/)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
# appspec/00-overview.md Provenance: "a single console command `mackup`".
mackup = "macklebox.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/macklebox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
